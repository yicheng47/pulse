name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag matches workspace version
        id: version
        run: |
          version=$(./script/bundle-mac --print-version)
          test "v$version" = "${{ github.ref_name }}" || { echo "error: tag ${{ github.ref_name }} does not match workspace version v$version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Verify Certificate
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate: $CERT_ID"

      - name: Build, sign, notarize, and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make release-macos

      - name: Fetch Sparkle tools
        run: |
          sparkle_version=2.9.5
          sparkle_sha256=015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc
          sparkle_archive="$RUNNER_TEMP/Sparkle-$sparkle_version.tar.xz"
          sparkle_dir="$RUNNER_TEMP/Sparkle-$sparkle_version"
          curl --fail --location "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz" --output "$sparkle_archive"
          printf '%s  %s\n' "$sparkle_sha256" "$sparkle_archive" | shasum -a 256 -c -
          mkdir -p "$sparkle_dir"
          tar -xf "$sparkle_archive" -C "$sparkle_dir"
          echo "SPARKLE_TOOLS_DIR=$sparkle_dir/bin" >> "$GITHUB_ENV"

      - name: Generate signed appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          appcast_dir="$RUNNER_TEMP/pulse-appcast"
          release_url="https://github.com/yicheng47/pulse/releases/tag/${{ github.ref_name }}"
          mkdir -p "$appcast_dir"
          cp "target/release/Pulse-${{ steps.version.outputs.version }}-arm64.dmg" "$appcast_dir/"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_TOOLS_DIR/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/yicheng47/pulse/releases/download/${{ github.ref_name }}/" \
            --full-release-notes-url "$release_url" \
            --link "$release_url" \
            --maximum-versions 1 \
            "$appcast_dir"
          cp "$appcast_dir/appcast.xml" target/release/appcast.xml

      - name: Attach DMG and appcast to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/Pulse-${{ steps.version.outputs.version }}-arm64.dmg
            target/release/appcast.xml
          fail_on_unmatched_files: true
          name: Pulse ${{ github.ref_name }}
          draft: true
