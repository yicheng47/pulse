[workspace]
resolver = "3"
members = ["crates/pulse-engine", "crates/pulse-cli", "crates/pulse-app"]

[workspace.package]
version = "0.1.2"
edition = "2024"
publish = false

[workspace.dependencies]
pulse-engine = { path = "crates/pulse-engine" }

objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFString"] }
objc2-audio-toolbox = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
coreaudio-rs = "0.13"
symphonia = { version = "0.5", default-features = false, features = ["flac", "alac", "isomp4", "wav", "aiff", "pcm"] }
rtrb = "0.3"
realfft = "3"
thiserror = "2"
libc = "0.2"
lofty = "0.24"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "functions"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
fastrand = "2"

gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "6c799b8e99" }
# `font-kit` is off by default in gpui_platform, and without it MacPlatform
# installs gpui::NoopTextSystem instead of MacTextSystem — no text renders at all.
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "6c799b8e99", features = ["font-kit"] }

clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
ureq = "3"
